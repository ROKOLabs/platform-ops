name: Deploy reporting CI

on:
  pull_request:
    paths:
      - platform/feature/pipeline/deploy-reporting/**
      - .github/workflows/deploy-reporting-ci.yml
      - .github/workflows/deploy-reporting-release.yml
  push:
    branches:
      - main
    paths:
      - platform/feature/pipeline/deploy-reporting/**
      - .github/workflows/deploy-reporting-ci.yml
      - .github/workflows/deploy-reporting-release.yml
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.core }} core
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: shell
            os: ubuntu-latest
          - core: powershell
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test core
        shell: bash
        env:
          TEST_CORE: ${{ matrix.core }}
        run: node --test platform/feature/pipeline/deploy-reporting/tests/core.test.mjs

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the POSIX core
        run: shellcheck platform/feature/pipeline/deploy-reporting/core/roko-adapter.sh

  github-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check wrapper contract
        run: node --test platform/feature/pipeline/deploy-reporting/tests/wrapper.test.mjs
      - name: Start mock endpoint
        run: |
          node platform/feature/pipeline/deploy-reporting/tests/mock-server.mjs \
            --port 18080 \
            --statuses 201 \
            --max-requests 1 \
            --output "$RUNNER_TEMP/roko-requests.jsonl" &
          attempt=0
          until curl --silent --fail http://127.0.0.1:18080/ready >/dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ "$attempt" -eq 20 ]; then
              echo "Mock endpoint did not start" >&2
              exit 1
            fi
            sleep 0.1
          done
      - name: Run nested GitHub Action
        uses: ./platform/feature/pipeline/deploy-reporting/wrappers/github
        with:
          url: http://127.0.0.1:18080/api/deploys
          token: live-test-token
          environment: ci
      - name: Verify live request
        run: >-
          node platform/feature/pipeline/deploy-reporting/tests/assert-live-request.mjs
          "$RUNNER_TEMP/roko-requests.jsonl"
          "$GITHUB_SHA"
          "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
