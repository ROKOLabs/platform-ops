name: Release deploy reporting adapter

on:
  push:
    tags:
      - deploy-reporting-v*.*.*

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_tag: ${{ steps.version.outputs.major_tag }}
    steps:
      - id: version
        name: Validate component tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^deploy-reporting-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
            echo "major_tag=deploy-reporting-v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Expected deploy-reporting-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

  test:
    needs: validate-tag
    uses: ./.github/workflows/deploy-reporting-ci.yml

  release:
    needs:
      - validate-tag
      - test
    runs-on: ubuntu-latest
    env:
      COMPONENT: platform/feature/pipeline/deploy-reporting
      VERSION: ${{ needs.validate-tag.outputs.version }}
      MAJOR_TAG: ${{ needs.validate-tag.outputs.major_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release assets
        shell: bash
        run: |
          mkdir -p dist/package/core dist/package/wrappers
          cp "$COMPONENT/core/roko-adapter.sh" dist/package/core/
          cp "$COMPONENT/core/roko-adapter.ps1" dist/package/core/
          cp -R "$COMPONENT/wrappers/github" dist/package/wrappers/
          cp "$COMPONENT/README.md" dist/package/
          cp LICENSE dist/package/
          chmod +x dist/package/core/roko-adapter.sh
          (
            cd dist/package
            zip -r "../roko-adapter-$VERSION.zip" .
          )
          cp "$COMPONENT/core/roko-adapter.sh" dist/
          cp "$COMPONENT/core/roko-adapter.ps1" dist/
          (
            cd dist
            sha256sum "roko-adapter-$VERSION.zip" roko-adapter.sh roko-adapter.ps1 > SHA256SUMS
          )
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/roko-adapter-$VERSION.zip"
          dist/roko-adapter.sh
          dist/roko-adapter.ps1
          dist/SHA256SUMS
          --generate-notes
          --title "Deploy reporting adapter $VERSION"
      - name: Move major tag
        run: |
          git tag --force "$MAJOR_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$MAJOR_TAG" --force
