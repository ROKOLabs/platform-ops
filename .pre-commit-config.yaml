minimum_pre_commit_version: 3.0.0

repos:
  - repo: https://github.com/google/yamlfmt
    rev: v0.19.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/trim21/dprint-pre-commit
    rev: v0.57.4.0
    hooks:
      - id: dprint
        name: Format PowerShell
        files: \.ps1$
