name: Report a deployment to Roko
description: Report a product deployment to Roko

inputs:
  url:
    description: Roko deployment reporting endpoint
    required: true
  token:
    description: Roko deployment token from the project's deployment settings
    required: true
  environment:
    description: Deployment environment name
    required: true
  strict:
    description: Fail the step if Roko cannot record the deployment
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Report deployment from Linux or macOS
      if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_STRICT: ${{ inputs.strict }}
        ROKO_SHA: ${{ github.sha }}
      run: |
        strict_arg=""
        if [ "$INPUT_STRICT" = "true" ]; then
          strict_arg="--strict"
        fi
        sh "$GITHUB_ACTION_PATH/../../core/roko-adapter.sh" \
          --url "$INPUT_URL" \
          --token "$INPUT_TOKEN" \
          --environment "$INPUT_ENVIRONMENT" \
          $strict_arg

    - name: Report deployment from Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_STRICT: ${{ inputs.strict }}
        ROKO_SHA: ${{ github.sha }}
      run: |
        $arguments = @(
          '--url', $env:INPUT_URL,
          '--token', $env:INPUT_TOKEN,
          '--environment', $env:INPUT_ENVIRONMENT
        )
        if ($env:INPUT_STRICT -eq 'true') {
          $arguments += '--strict'
        }
        & "$env:GITHUB_ACTION_PATH/../../core/roko-adapter.ps1" @arguments
